<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>world.execute(me); — 矩阵</title>
<!--
  world.execute(me); / the matrix
  ============================================================
  双击本文件即可播放。不需要服务器、不构建、不联网。
  唯一时钟： t = audio.currentTime + syncOffset
  每一帧都是 t 的纯函数（无帧计数、无跨帧状态、无 Math.random）。

  快捷键
   space 播放/暂停    ← → 快退/快进 5s (Shift = 1s)
   , . 同步偏移 ±10ms (Shift = ±1ms)    / 归零
   R 重播   F 全屏   H 隐藏界面   D 调试
   ↑ ↓ 音量   Home / End 首尾

  音频须与本文件同级。页面会尝试：
    Mili - world.execute(me);.mp3
    Mili - world.execute (me) ;.mp3
    ...
-->
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div id="shell">
  <div id="stage">
    <canvas id="view" width="1920" height="1080"></canvas>
    <!-- no crossorigin attribute on purpose: under file:// an opaque origin can
         never satisfy CORS and Chrome reports MEDIA_ERR_SRC_NOT_SUPPORTED. -->
    <audio id="audio" preload="auto"></audio>
    <div id="start"><b>点击开始</b><small>CLICK TO BEGIN</small></div>
    <div id="toast"></div>
    <div id="fallback"></div>
  </div>

  <header id="hud">
    <div class="brand"><span class="sig">world.execute(me);</span><span class="sep">/</span><span class="sub">矩阵 · the matrix</span></div>
    <div class="meta"><span id="state">READY</span><span class="sep">/</span><span id="clock" class="mono">0:00.000</span></div>
  </header>

  <footer id="ctrl">
    <div id="bar" role="slider" tabindex="0" aria-label="播放进度">
      <canvas id="wave" width="1920" height="44"></canvas>
      <div id="fill"></div>
      <div id="head"></div>
    </div>
    <div class="row">
      <div class="grp">
        <button id="btn-play" class="btn" aria-label="播放/暂停"><svg viewBox="0 0 24 24"><path d="M8 5l12 7-12 7z"/></svg></button>
        <button id="btn-replay" class="btn" aria-label="重播"><svg viewBox="0 0 24 24"><path d="M12 5V2L7 6l5 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7z"/></svg></button>
        <span class="time mono" id="tot">3:31.913</span>
      </div>
      <div class="grp grow">
        <label for="vol" class="lbl">VOL</label>
        <input id="vol" class="range" type="range" min="0" max="1" step="0.01" value="0.9">
      </div>
      <div class="grp"><button id="btn-full" class="btn" aria-label="全屏"><svg viewBox="0 0 24 24"><path d="M4 9V4h5v2H6v3zM15 4h5v5h-2V6h-3zM4 15h2v3h3v2H4zM18 15h2v5h-5v-2h3z"/></svg></button></div>
    </div>
  </footer>
</div>
